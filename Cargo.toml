[package]
name = "bevy_procedural_grass"
version = "0.3.0"
edition = "2024"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "grass"]
repository = "https://github.com/jadedbay/bevy_procedural_grass/"
description = "A plugin for bevy to generate grass"
documentation = "https://docs.rs/bevy_procedural_grass/latest/bevy_procedural_grass/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy-inspector-egui = { version = "0.36", optional = true }
bytemuck = "1.25"
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }

[dependencies.bevy]
version = "0.18"
default-features = false
features = [ "bevy_core_pipeline", "bevy_render", "bevy_pbr" ]

[dev-dependencies]
bevy = { version = "0.18", default-features = false, features = ["bevy_winit", "tonemapping_luts", "zstd_rust"] }
noise = "0.9"

[features]
bevy-inspector-egui = ["dep:bevy-inspector-egui"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "inspect"
required-features = ["bevy-inspector-egui"]
